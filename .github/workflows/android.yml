name: Build Kharcha APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (SMS parser + insights engine)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Kharcha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-apk
          path: Kharcha.apk

      # A release is the easiest way to download the APK straight onto your phone.
      - name: Publish "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kharcha-latest
          name: Kharcha (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **Kharcha.apk** on your Android phone and open it to install.
          files: Kharcha.apk
